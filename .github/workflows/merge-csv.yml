name: 去重补齐 CSV

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: '提交说明（可选）'
        required: false
        default: '手动补期：去重合并 CSV'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行合并脚本
        run: python scripts/merge_csv.py new.csv lottery.csv

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lottery.csv
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "${{ github.event.inputs.commit_message }}"
            git push
          fi
